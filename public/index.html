<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="简洁高效的上网导航与搜索入口">
  <meta name="theme-color" content="#f6f7f9">
  <title>上网导航</title>
  <link rel="stylesheet" href="/style.css?v=20260727-3">
  <link rel="stylesheet" href="/search.css?v=20260727-3">
  <link rel="stylesheet" href="/c0c-theme.css?v=20260727-3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="上网导航首页"><span>上网导航</span></a>
    <div class="actions">
      <button id="themeBtn" class="icon-btn" title="切换主题" aria-label="切换主题">◐</button>
      <button id="manageBtn" class="command-btn">管理</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <p id="dateText" class="date"></p>
        <h1>上网，从这里开始</h1>
        <p id="hitokoto" class="motto">爱人者，人恒爱之。敬人者，人恒敬之</p>
        <div class="search-panel">
          <div id="engineList" class="engine-list" aria-label="搜索引擎"></div>
          <form id="searchForm" class="search-box">
            <input id="searchInput" type="search" placeholder="微软必应搜索" autocomplete="off" required>
            <button type="submit" class="search-btn" aria-label="搜索">⌕</button>
          </form>
        </div>
      </div>
    </section>
    <section class="content"><div id="groups" class="groups"></div></section>
  </main>

  <dialog id="loginDialog">
    <form id="loginForm" class="dialog-form">
      <div class="dialog-head"><h2>管理登录</h2><button type="button" class="icon-btn close-dialog" aria-label="关闭">×</button></div>
      <label>管理密码<input id="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error"></p>
      <button class="primary" type="submit">登录</button>
    </form>
  </dialog>

  <dialog id="editorDialog">
    <form id="editorForm" class="dialog-form wide">
      <div class="dialog-head"><h2 id="editorTitle">编辑书签</h2><button type="button" class="icon-btn close-dialog" aria-label="关闭">×</button></div>
      <input id="editCategory" type="hidden"><input id="editIndex" type="hidden">
      <label>名称<input id="editName" required maxlength="40"></label>
      <label>网址<input id="editUrl" type="url" required></label>
      <label>描述<input id="editDescription" maxlength="100"></label>
      <label>自定义图标<input id="editIcon" type="url" placeholder="可选，填写图片 URL"></label>
      <div class="dialog-actions"><button type="button" id="deleteLink" class="danger">删除</button><button type="submit" class="primary">保存</button></div>
    </form>
  </dialog>

  <dialog id="engineDialog">
    <form id="engineForm" class="dialog-form">
      <div class="dialog-head"><h2>添加搜索引擎</h2><button type="button" class="icon-btn close-dialog" aria-label="关闭">×</button></div>
      <label>名称<input id="engineName" required maxlength="20" placeholder="例如：百度"></label>
      <label>搜索地址<input id="engineUrl" type="url" required placeholder="https://www.baidu.com/s?wd="></label>
      <label>输入框提示<input id="enginePlaceholder" maxlength="40" placeholder="例如：百度一下"></label>
      <p class="field-help">搜索词会自动追加到搜索地址末尾。</p>
      <button class="primary" type="submit">添加</button>
    </form>
  </dialog>

  <div id="categoryModal" class="category-modal" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
    <form id="categoryForm" class="dialog-form">
      <div class="dialog-head"><h2 id="categoryModalTitle">添加分类</h2><a href="#top" class="icon-btn modal-close" aria-label="关闭">×</a></div>
      <label>分类名称<input id="categoryName" required maxlength="20" placeholder="例如：常用工具"></label>
      <button class="primary" type="submit">添加分类</button>
    </form>
  </div>

  <template id="adminBarTemplate"><div class="admin-bar"><strong>管理模式</strong><span>点击书签可编辑，使用箭头调整顺序</span><a id="addCategory" href="#categoryModal">＋ 分类</a><button id="saveData" class="primary" type="button">保存更改</button><button id="exitAdmin" type="button">退出</button></div></template>
  <script src="/app.js?v=20260727-3" defer></script>
</body>
</html>
